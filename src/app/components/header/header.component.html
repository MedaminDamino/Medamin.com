<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">
    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMobileMenu()">
      <span class="logo-text">Mohamed Amin Abdelkafi</span>
      <span class="logo-subtitle">Full Stack Developer</span>
    </a>
    
    <!-- Navigation Actions -->
    <div class="nav-actions">
      <!-- Desktop & Mobile Menu -->
      <ul class="nav-menu" [class.active]="isMobileMenuOpen">
        <li>
          <a routerLink="/" 
             routerLinkActive="active" 
             [routerLinkActiveOptions]="{exact: true}"
             (click)="closeMobileMenu()">
            Home
          </a>
        </li>
        <li>
          <a routerLink="/skills" 
             routerLinkActive="active"
             (click)="closeMobileMenu()">
            Skills
          </a>
        </li>
        <li>
          <a routerLink="/projects" 
             routerLinkActive="active"
             (click)="closeMobileMenu()">
            Projects
          </a>
        </li>
        <li>
          <a routerLink="/contact" 
             routerLinkActive="active"
             (click)="closeMobileMenu()">
            Contact
          </a>
        </li>
      </ul>
      
      <!-- Theme Toggle -->
      <button class="theme-toggle" 
              (click)="toggleTheme()" 
              [attr.aria-label]="(themeService.darkMode$ | async) ? 'Switch to light mode' : 'Switch to dark mode'"
              title="Toggle theme">
        <span class="theme-icon">{{ (themeService.darkMode$ | async) ? '☀️' : '🌙' }}</span>
      </button>
      
      <!-- Desktop CTA Button -->
      <a routerLink="/contact" class="cta-button">Let's Talk</a>
      
      <!-- Mobile Menu Button -->
      <button class="mobile-menu-btn" 
              (click)="toggleMobileMenu()"
              [attr.aria-expanded]="isMobileMenuOpen"
              aria-label="Toggle navigation menu">
        <span class="hamburger" [class.active]="isMobileMenuOpen"></span>
      </button>
    </div>
  </div>
</nav>
